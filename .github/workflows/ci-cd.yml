name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore HackatonFiap.Notifications.sln

      - name: Build
        run: dotnet build HackatonFiap.Notifications.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test HackatonFiap.Notifications.sln --configuration Release --no-build --verbosity minimal

  cd:
    name: Deploy to Azure Functions (opcional)
    runs-on: ubuntu-latest
    needs: ci
    # Gated: só roda em push na main COM a variável DEPLOY_ENABLED=true.
    # Assim a CI (build+test) permanece verde sem os secrets Azure (RT5) — antes
    # a CD rodava sempre e quebrava no Azure Login por falta de AZURE_CREDENTIALS.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Este serviço é uma Azure Function (.NET 8 isolated), NÃO um container/AKS/ACA.
      # Publica direto na Function App gerenciada via azure/functions-action.
      - name: Publish Function
        run: dotnet publish src/HackatonFiap.Notifications/HackatonFiap.Notifications.csproj -c Release -o ./output

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: func-conexao-notifications-7xafxr
          package: ./output

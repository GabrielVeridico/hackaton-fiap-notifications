name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Enfileira os runs em vez de deixar dois deploys concorrentes disputarem o mesmo
# Function App. cancel-in-progress fica false: abortar no meio de um rollout
# deixaria o recurso em estado indeterminado.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore HackatonFiap.Notifications.sln

      - name: Build
        run: dotnet build HackatonFiap.Notifications.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test HackatonFiap.Notifications.sln --configuration Release --no-build --verbosity minimal

  cd:
    name: Deploy to Azure Functions (opcional)
    runs-on: ubuntu-latest
    needs: ci
    # Gated: push na main ou disparo manual, e só com a variável DEPLOY_ENABLED=true.
    # Assim a CI (build+test) permanece verde sem os secrets Azure (RT5) — antes
    # a CD rodava sempre e quebrava no Azure Login por falta de credenciais.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
      && vars.DEPLOY_ENABLED == 'true'
    permissions:
      id-token: write # obrigatório para o OIDC do azure/login
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Autenticação federada (OIDC): nenhuma senha de longa duração fica guardada no repositório.
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Este serviço é uma Azure Function (.NET 8 isolated), NÃO um container/AKS/ACA.
      # Publica direto na Function App gerenciada via azure/functions-action.
      - name: Publish Function
        run: dotnet publish src/HackatonFiap.Notifications/HackatonFiap.Notifications.csproj -c Release -o ./output

      # O plano é Flex Consumption (FC1) — o `sku` precisa ser explícito para a action
      # usar a API OneDeploy em vez do zipdeploy clássico.
      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ secrets.FUNCTION_APP_NAME }}
          package: ./output
          sku: flexconsumption

      # Passo de gate, não decorativo: a functions-action pode retornar sucesso e a função
      # não subir (pacote inválido, host em crash-loop). Aqui exigimos que o app esteja
      # Running e que pelo menos uma function esteja registrada, senão o job falha.
      - name: Confirma que a Function subiu
        run: |
          set -euo pipefail
          RG='${{ secrets.RESOURCE_GROUP }}'
          APP='${{ secrets.FUNCTION_APP_NAME }}'

          # Dependendo da versão da az CLI o show devolve o shape ARM cru ou o achatado.
          ESTADO=$(az functionapp show -g "$RG" -n "$APP" --query "properties.state" -o tsv)
          [ -n "$ESTADO" ] && [ "$ESTADO" != "null" ] || \
            ESTADO=$(az functionapp show -g "$RG" -n "$APP" --query "state" -o tsv)
          echo "Function App: $ESTADO"
          if [ "$ESTADO" != "Running" ]; then
            echo "::error::Function App em estado '$ESTADO', esperado Running"
            exit 1
          fi

          # O host só lista as functions depois de recarregar o pacote novo.
          for tentativa in $(seq 1 20); do
            QTD=$(az functionapp function list -g "$RG" -n "$APP" --query "length(@)" -o tsv 2>/dev/null || echo 0)
            echo "  [$tentativa/20] functions registradas: $QTD"
            if [ "${QTD:-0}" -gt 0 ]; then
              az functionapp function list -g "$RG" -n "$APP" \
                --query "[].{nome:name,desabilitada:isDisabled}" -o table
              exit 0
            fi
            sleep 15
          done
          echo "::error::nenhuma function registrada 5min após o deploy"
          exit 1
